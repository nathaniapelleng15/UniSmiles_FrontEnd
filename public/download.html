<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniSmile – Download Foto Kamu 📸</title>
  <meta name="description" content="Download foto booth kamu dari UniSmile Photobooth" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0c1633;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    /* Decorative blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 320px; height: 320px; background: rgba(246,205,70,0.18); top: -60px; right: -60px; }
    .blob-2 { width: 260px; height: 260px; background: rgba(99,102,241,0.18); bottom: -40px; left: -40px; }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      animation: fadeUp 0.5s ease-out both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      height: 48px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #f6cd46, #fff 60%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.55);
      margin-bottom: 28px;
    }

    /* Photo preview */
    .photo-wrapper {
      background: #1b2b5a;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }

    #photo-preview {
      width: 100%;
      height: auto;
      max-height: 55vh;
      object-fit: contain;
      display: block;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.18s ease;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, #f6cd46, #f0a500);
      color: #0c1633;
      box-shadow: 0 8px 24px rgba(246,205,70,0.35);
      margin-bottom: 12px;
    }
    .btn-primary:hover { box-shadow: 0 12px 32px rgba(246,205,70,0.55); }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.8);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.14); }

    /* State messages */
    .state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px 0;
      color: rgba(255,255,255,0.5);
    }
    .state-box svg { opacity: 0.5; }
    .state-box p { font-size: 0.95rem; }

    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #f6cd46;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 0.875rem;
      color: #fca5a5;
      margin-bottom: 20px;
      display: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34,197,94,0.15);
      border: 1px solid rgba(34,197,94,0.35);
      color: #86efac;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 16px;
    }

    .footer-text {
      margin-top: 28px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.3);
      z-index: 1;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
    <img src="/assets/LOGO UNI SMILE.png" alt="UniSmile" class="logo" onerror="this.style.display='none'" />

    <h1>Foto Kamu Siap! 🎉</h1>
    <p class="subtitle">Tap tombol di bawah untuk menyimpan foto booth-mu</p>

    <!-- Loading state -->
    <div class="state-box" id="state-loading">
      <div class="spinner"></div>
      <p>Memuat foto...</p>
    </div>

    <!-- Error state -->
    <div class="error-msg" id="error-msg">
      ❌ Link foto tidak ditemukan atau sudah kedaluwarsa.
    </div>

    <!-- Photo content (hidden until loaded) -->
    <div id="photo-content" style="display:none">
      <div class="badge">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <circle cx="5" cy="5" r="5" fill="#22c55e"/>
        </svg>
        Foto tersedia
      </div>

      <div class="photo-wrapper">
        <img id="photo-preview" alt="Foto UniSmile" />
      </div>

      <a id="btn-download" class="btn btn-primary" download="UniSmile-Photo.png">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download Foto
      </a>

      <button class="btn btn-secondary" onclick="sharePhoto()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        Bagikan Foto
      </button>
    </div>
  </div>

  <p class="footer-text">UniSmile Photobooth &copy; 2025 &middot; Powered by Uni Inside Telu</p>

  <script>
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function show(id) { document.getElementById(id).style.display = ''; }
    function hide(id) { document.getElementById(id).style.display = 'none'; }

    async function init() {
      const photoUrl = getParam('url');

      if (!photoUrl) {
        hide('state-loading');
        const err = document.getElementById('error-msg');
        err.textContent = '❌ Link foto tidak ditemukan. Coba scan ulang QR code dari booth.';
        err.style.display = 'block';
        return;
      }

      // Decode the URL (it was encodeURIComponent'd)
      const decoded = decodeURIComponent(photoUrl);

      const img = document.getElementById('photo-preview');
      const btnDownload = document.getElementById('btn-download');

      img.onload = () => {
        hide('state-loading');
        show('photo-content');
      };

      img.onerror = () => {
        hide('state-loading');
        const err = document.getElementById('error-msg');
        err.textContent = '❌ Gagal memuat foto. Link mungkin sudah kedaluwarsa.';
        err.style.display = 'block';
      };

      img.src = decoded;
      btnDownload.href = decoded;
    }

    async function sharePhoto() {
      const photoUrl = getParam('url');
      if (!photoUrl) return;
      const decoded = decodeURIComponent(photoUrl);

      if (navigator.share) {
        try {
          // Try to share as file (works on mobile)
          const resp = await fetch(decoded);
          const blob = await resp.blob();
          const file = new File([blob], 'UniSmile-Photo.png', { type: blob.type });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Foto UniSmile Photobooth 📸' });
          } else {
            await navigator.share({ url: decoded, title: 'Foto UniSmile Photobooth 📸' });
          }
        } catch (e) {
          // Fallback: copy link to clipboard
          copyLink(decoded);
        }
      } else {
        copyLink(decoded);
      }
    }

    function copyLink(url) {
      navigator.clipboard?.writeText(url).then(() => {
        alert('Link foto berhasil disalin! 📋');
      });
    }

    init();
  </script>
</body>
</html>
